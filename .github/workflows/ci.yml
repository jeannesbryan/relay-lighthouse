name: CI

# WHY THIS EXISTS
# ------------------------------------------------------------------
# The hub had no tests at all until v8.0.4 gave it real logic: input validation
# on an unauthenticated endpoint, a self-healing schema migration for hubs
# installed before the version column existed, and a fleet tally.
#
# Two mistakes were made while building that, and both were caught only because
# the behaviour was exercised rather than read:
#   - the migration matched only SQLite's "no such column" wording, which is what
#     SELECT says; an INSERT says "table X has no column named Y". It looked
#     correct and never ran.
#   - PDO's SQLite driver uses native prepares, so an unknown column is raised by
#     prepare(), not execute(). A try block around execute() alone catches
#     nothing.
# tests/version_test.php pins both. This workflow runs it.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none

      - name: Syntax check every PHP file
        run: |
          set -e
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*')
          echo "Checked $count PHP files."
          exit $fail

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none

      - name: Version reporting (validation, migration, fleet tally)
        run: php tests/version_test.php

      - name: Confirm the test run left no database behind
        run: |
          if [ -f data/lighthouse.sqlite ]; then
            echo "::error::a test wrote to data/lighthouse.sqlite"
            exit 1
          fi
          echo "data/ is clean."
